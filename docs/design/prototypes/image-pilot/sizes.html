<title>Image Pilot Sizes</title>
<style>
  :root {
    --bg: #fbf9f5; --panel: #F6F2EA; --ink: #3b2f25; --muted: #7d6e60; --line: #e6ddd0;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1814; --panel: #26211c; --ink: #efe7dc; --muted: #a8998a; --line: #3a322a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1814; --panel: #26211c; --ink: #efe7dc; --muted: #a8998a; --line: #3a322a;
    color-scheme: dark;
  }
  body { background: var(--bg); color: var(--ink); padding: 24px 16px;
         font: 14px/1.45 -apple-system, system-ui, sans-serif; }
  .wrap { max-width: 1000px; margin: 0 auto; display: grid; gap: 16px; }
  h1 { font-size: 20px; margin: 0; text-wrap: balance; }
  p.note { color: var(--muted); margin: 0; max-width: 65ch; }
  label { color: var(--muted); }
  select { font: inherit; padding: 4px 8px; margin-left: 6px; }
  .row { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap;
         padding: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  .label { font-weight: 700; font-size: 14px; width: 110px; overflow-wrap: anywhere; }
  figure { margin: 0; max-width: 100%; }
  figcaption { color: var(--muted); font-size: 11px; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .img { background-repeat: no-repeat; border-radius: 6px; max-width: 100%; }
</style>
<div class="wrap">
  <h1>Image pilot: each style at app sizes</h1>
  <p class="note">Each cell of the comparison image, cropped to the shape and size it would appear at in the app.
  The crops are approximate: grid cells still carry the letter label and gutter edges, which final single images won't have.</p>
  <div><label for="grid">Dish</label><select id="grid"></select></div>
  <div id="rows" class="wrap"></div>
</div>
<script>
  // Add new grids here as they arrive (same folder).
  // Each option lists its cells. A cell names an image, how that image splits
  // into cells (cols/rows, source pixel size w/h) and which cell it is (i).
  const P1 = { file: 'GP-pozole-c1c2.png', w: 1536, h: 1024, cols: 2, rows: 1 };
  const PB = { file: 'GP-pozole-b.png', w: 1536, h: 1024, cols: 1, rows: 1 };
  const T = { file: 'GC-tacos.png', w: 1254, h: 1254, cols: 2, rows: 2 };
  const M = { file: 'G1-mole.png', w: 1254, h: 1254, cols: 2, rows: 2 };
  const F = { file: 'GF-c2-set.png', w: 1254, h: 1254, cols: 2, rows: 2 };
  const one = (file, label) => ({ file, label, w: 1536, h: 1024, cols: 1, rows: 1, i: 0 });
  const GRIDS = [
    { name: 'API finals: tamales', cells: [
      one('finals/MX/tamales-ref.png', 'with reference (high)'), one('finals/MX/tamales.png', 'no reference (medium)'), one('finals/MX/tamales-gpt-image-1.png', 'gpt-image-1')] },
    { name: 'C2 set: all four dishes', cells: ['Mole', 'Tacos', 'Pozole', 'Chiles'].map((label, i) => ({ ...F, i, label })) },
    { name: 'Pozole: C1, C2 and B', cells: [
      { ...P1, i: 0, label: 'C1' }, { ...P1, i: 1, label: 'C2' }, { ...PB, i: 0, label: 'B' }] },
    { name: 'Tacos: C variants', cells: ['C1', 'C2', 'C3', 'C4'].map((label, i) => ({ ...T, i, label })) },
    { name: 'Mole: four styles', cells: ['A', 'B', 'C', 'D'].map((label, i) => ({ ...M, i, label })) },
  ];
  const SIZES = [
    { w: 540, h: 320, name: 'Detail header (desktop)' },
    { w: 230, h: 150, name: 'Explore tile' },
    { w: 110, h: 110, name: 'Start-with strip' },
    { w: 64,  h: 64,  name: 'Restaurant row' },
  ];
  const sel = document.getElementById('grid');
  GRIDS.forEach((g, i) => sel.add(new Option(g.name, i)));
  function render() {
    const rows = document.getElementById('rows');
    rows.innerHTML = '';
    GRIDS[sel.value].cells.forEach(g => {
      const letter = g.label, col = g.i % g.cols, row = Math.floor(g.i / g.cols);
      const cw = g.w / g.cols, ch = g.h / g.rows; // one cell, in source pixels
      const r = document.createElement('div');
      r.className = 'row';
      r.innerHTML = `<div class="label">${letter}</div>`;
      SIZES.forEach(s => {
        const k = Math.max(s.w / cw, s.h / ch); // scale one cell to cover the box
        const f = document.createElement('figure');
        const d = document.createElement('div');
        d.className = 'img';
        Object.assign(d.style, {
          width: s.w + 'px', height: s.h + 'px',
          backgroundImage: `url(${g.file})`,
          backgroundSize: `${g.w * k}px ${g.h * k}px`,
          backgroundPosition: `${-(col * cw * k) - (cw * k - s.w) / 2}px ${-(row * ch * k) - (ch * k - s.h) / 2}px`,
        });
        f.append(d);
        f.insertAdjacentHTML('beforeend', `<figcaption>${s.name} · ${s.w}×${s.h}</figcaption>`);
        r.append(f);
      });
      rows.append(r);
    });
  }
  sel.onchange = render;
  render();
</script>
