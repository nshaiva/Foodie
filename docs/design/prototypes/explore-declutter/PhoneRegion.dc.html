<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone, Central Mexico region at half height</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&amp;family=Inter:wght@400;500;600&amp;family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;color:#2B2A26;background:#F6F2EA}
a{color:#A8492F;text-decoration:none}a:hover{color:#8A3A24}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F3EFE7; font-family: Inter, system-ui, sans-serif; color: #2B2A26">
  <svg width="390" height="400" viewBox="0 0 390 400" style="position: absolute; left: 0; top: 0" role="img" aria-label="Map zoomed to Central Mexico">
    <g transform="translate(-340, -360) scale(2.1)">
      <path d="M60,120 L170,110 L200,130 L250,128 L285,170 L300,215 L318,250 L310,300 L318,345 L340,370 L360,360 L368,330 L385,322 L382,355 L360,395 L330,400 L312,425 L280,410 L245,395 L205,378 L170,350 L150,300 L130,255 L110,210 L85,160 Z" fill="#E3E6DD" stroke="#3E5A3B" stroke-width="0.8" stroke-linejoin="round"/>
      <path d="M195,212 L290,205 L300,215 L318,250 L310,300 L318,300 L200,340 Z" fill="#C3CEB6" stroke="none"/>
      <path d="M95,215 L290,205 M195,212 L200,340 M200,340 L318,300 M240,390 L300,330" fill="none" stroke="#3E5A3B" stroke-width="0.6" stroke-dasharray="3 3" stroke-opacity="0.7"/>
      <text x="252" y="270" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-style="italic" font-weight="600" font-size="12" fill="#2B2A26">Central</text>
      <text x="182" y="290" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-style="italic" font-weight="500" font-size="8" fill="#6B655B">Coastal</text>
    </g>
  </svg>

  <div style="position: absolute; left: 16px; top: 56px; height: 40px; padding: 0 14px; border-radius: 12px; background: #FFFFFF; box-shadow: 0 2px 8px rgba(43,42,38,0.12); display: flex; align-items: center; gap: 6px; font-size: 15px">
    <span style="color: #6B655B">World</span>
    <span style="color: #6B655B">›</span>
    <span style="color: #6B655B">Mexico</span>
    <span style="color: #6B655B">›</span>
    <span style="font-weight: 700">Central</span>
  </div>

  <div style="position: absolute; left: 0; right: 0; top: 380px; bottom: 0; border-radius: 20px 20px 0 0; background: #F6F2EA; box-shadow: 0 -6px 20px rgba(43,42,38,0.12); overflow: hidden">
    <div style="padding: 10px 20px 24px; display: flex; flex-direction: column; gap: 16px">
      <div style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #D9D1C3"></div>
      <header style="display: flex; flex-direction: column; gap: 8px">
        <h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-style: italic; font-weight: 600; font-size: 30px; line-height: 1.05">Central Mexico</h1>
        <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #3A3832">Mexico City and Puebla: complex moles, street tacos and antojitos.</p>
        <div style="display: flex; gap: 6px">
          <span style="padding: 4px 9px; border-radius: 4px; background: #B03526; color: #FFFFFF; font-size: 12px; font-weight: 700">Heat</span>
          <span style="padding: 4px 9px; border-radius: 4px; background: #5C5652; color: #FFFFFF; font-size: 12px; font-weight: 700">Smoke/Earth</span>
          <span style="padding: 4px 9px; border-radius: 4px; background: #A9536F; color: #FFFFFF; font-size: 12px; font-weight: 700">Sweet</span>
        </div>
      </header>
      <div style="background: #FFFFFF; border: 1px solid #E8E1D5; border-radius: 14px; overflow: hidden">
        <sc-for list="{{dishes}}" as="d" hint-placeholder-count="3">
          <a href="PhoneDetail.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; color: #2B2A26; border-top: {{d.sep}}">
            <div style="width: 56px; height: 56px; flex-shrink: 0; border-radius: 10px; background: {{d.tint}}; display: flex; align-items: center; justify-content: center">
              <svg width="30" height="30" viewBox="0 0 34 34" fill="none" stroke="#8C7A66" stroke-opacity="0.5" stroke-width="1.5" aria-hidden="true"><circle cx="17" cy="17" r="15"/><circle cx="17" cy="17" r="9"/></svg>
            </div>
            <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
              <div style="font-family: Nunito, sans-serif; font-weight: 700; font-size: 16px">{{d.name}}</div>
              <div style="font-size: 14px; line-height: 1.35; color: #6B655B">{{d.tag}}</div>
            </div>
            <sc-if value="{{d.tried}}" hint-placeholder-val="{{false}}">
              <div style="display: flex; align-items: center; gap: 3px; font-size: 13px; font-weight: 700; color: #3E6B45; flex-shrink: 0" aria-label="Tried, rated {{d.stars}} of 5">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>
                ★ {{d.stars}}
              </div>
            </sc-if>
            <sc-if value="{{d.want}}" hint-placeholder-val="{{false}}">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="#B7832F" stroke="#B7832F" stroke-width="2" stroke-linejoin="round" role="img" aria-label="On your want-to-try list" style="flex-shrink: 0"><path d="M6 3h12v18l-6-4-6 4z"/></svg>
            </sc-if>
          </a>
        </sc-for>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const list = [
      { name: 'Mole Poblano', tag: 'Dark chili and chocolate sauce over turkey, from Puebla', tint: '#E3CFC0', tried: true, want: false, stars: '4' },
      { name: 'Chiles en Nogada', tag: 'Stuffed poblano in walnut cream with pomegranate', tint: '#E6DDC9', tried: false, want: true, stars: '' },
      { name: 'Tequila', tag: 'Blue agave spirit from Jalisco, blanco to añejo', tint: '#EDE4CF', tried: false, want: false, stars: '' }
    ];
    return { dishes: list.map((d, i) => ({ ...d, sep: i === 0 ? 'none' : '1px solid #EFE9DE' })) };
  }
}
</script>
</body>
</html>
