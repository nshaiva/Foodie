<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Central Mexico region</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&amp;family=Inter:wght@400;500;600&amp;family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;color:#2B2A26;background:#F6F2EA}
a{color:#A8492F;text-decoration:none}a:hover{color:#8A3A24}
</style>
</helmet>
<div style="width: 540px; height: 1000px; box-sizing: border-box; background: #F6F2EA; font-family: Inter, system-ui, sans-serif; color: #2B2A26; padding: 24px 32px 40px; display: flex; flex-direction: column; gap: 26px">

  <a href="Main.dc.html" style="display: flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 600; height: 32px">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    Mexico
  </a>

  <header style="display: flex; flex-direction: column; gap: 12px">
    <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #6B655B">Region of Mexico</div>
    <h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-style: italic; font-weight: 600; font-size: 40px; line-height: 1.05; color: #2B2A26">Central Mexico</h1>
    <p style="margin: 0; font-size: 16px; line-height: 1.55; color: #3A3832">Mexico City and Puebla: complex moles, street tacos and the antojitos most people know as Mexican food.</p>
    <div style="display: flex; gap: 6px; align-items: center; flex-wrap: wrap">
      <span style="padding: 4px 9px; border-radius: 4px; background: #B03526; color: #FFFFFF; font-size: 12px; font-weight: 700">Heat</span>
      <span style="padding: 4px 9px; border-radius: 4px; background: #5C5652; color: #FFFFFF; font-size: 12px; font-weight: 700">Smoke/Earth</span>
      <span style="padding: 4px 9px; border-radius: 4px; background: #A9536F; color: #FFFFFF; font-size: 12px; font-weight: 700">Sweet</span>
      <button type="button" style="margin-left: 6px; height: 32px; padding: 0 4px; border: 0; background: none; color: #A8492F; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 4px">
        Key ingredients
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
    </div>
  </header>

  <section style="display: flex; flex-direction: column; gap: 10px">
    <div style="font-size: 14px; font-weight: 600; color: #6B655B">3 dishes from here</div>
    <div style="background: #FFFFFF; border: 1px solid #E8E1D5; border-radius: 16px; overflow: hidden">
      <sc-for list="{{dishes}}" as="d" hint-placeholder-count="3">
        <a href="DishDetail.dc.html" style="display: flex; align-items: center; gap: 14px; padding: 12px 16px; color: #2B2A26; border-top: {{d.sep}}">
          <div style="width: 64px; height: 64px; flex-shrink: 0; border-radius: 12px; background: {{d.tint}}; display: flex; align-items: center; justify-content: center">
            <svg width="34" height="34" viewBox="0 0 34 34" fill="none" stroke="#8C7A66" stroke-opacity="0.5" stroke-width="1.5" aria-hidden="true"><circle cx="17" cy="17" r="15"/><circle cx="17" cy="17" r="9"/></svg>
          </div>
          <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
            <div style="font-family: Nunito, sans-serif; font-weight: 700; font-size: 16px">{{d.name}}</div>
            <div style="font-size: 14px; line-height: 1.4; color: #6B655B">{{d.tag}}</div>
          </div>
          <sc-if value="{{d.tried}}" hint-placeholder-val="{{false}}">
            <div style="display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; color: #3E6B45; flex-shrink: 0" aria-label="Tried, rated {{d.stars}} of 5">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>
              ★ {{d.stars}}
            </div>
          </sc-if>
          <sc-if value="{{d.want}}" hint-placeholder-val="{{false}}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="#B7832F" stroke="#B7832F" stroke-width="2" stroke-linejoin="round" role="img" aria-label="On your want-to-try list" style="flex-shrink: 0"><path d="M6 3h12v18l-6-4-6 4z"/></svg>
          </sc-if>
        </a>
      </sc-for>
    </div>
  </section>

  <nav aria-label="Other regions" style="display: flex; flex-direction: column; gap: 10px">
    <div style="font-size: 14px; font-weight: 600; color: #6B655B">Other regions</div>
    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <a href="#" style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #E0D8CA; background: #FFFFFF; color: #2B2A26; display: flex; align-items: center; gap: 6px; font-family: Fraunces, Georgia, serif; font-style: italic; font-size: 15px">Oaxaca <span style="font-family: Inter, sans-serif; font-style: normal; font-size: 12px; color: #6B655B">1</span></a>
      <a href="#" style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #E0D8CA; background: #FFFFFF; color: #2B2A26; display: flex; align-items: center; gap: 6px; font-family: Fraunces, Georgia, serif; font-style: italic; font-size: 15px">Yucatán <span style="font-family: Inter, sans-serif; font-style: normal; font-size: 12px; color: #6B655B">0</span></a>
      <a href="#" style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #E0D8CA; background: #FFFFFF; color: #2B2A26; display: flex; align-items: center; gap: 6px; font-family: Fraunces, Georgia, serif; font-style: italic; font-size: 15px">Northern <span style="font-family: Inter, sans-serif; font-style: normal; font-size: 12px; color: #6B655B">0</span></a>
      <a href="#" style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #E0D8CA; background: #FFFFFF; color: #2B2A26; display: flex; align-items: center; gap: 6px; font-family: Fraunces, Georgia, serif; font-style: italic; font-size: 15px">Coastal <span style="font-family: Inter, sans-serif; font-style: normal; font-size: 12px; color: #6B655B">0</span></a>
    </div>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":540,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const list = [
      { name: 'Mole Poblano', tag: 'Dark chili and chocolate sauce over turkey, from Puebla', tint: '#E3CFC0', tried: true, want: false, stars: '4' },
      { name: 'Chiles en Nogada', tag: 'Stuffed poblano in walnut cream with pomegranate', tint: '#E6DDC9', tried: false, want: true, stars: '' },
      { name: 'Tequila', tag: 'Blue agave spirit from Jalisco, blanco to añejo', tint: '#EDE4CF', tried: false, want: false, stars: '' }
    ];
    return { dishes: list.map((d, i) => ({ ...d, sep: i === 0 ? 'none' : '1px solid #EFE9DE' })) };
  }
}
</script>
</body>
</html>
